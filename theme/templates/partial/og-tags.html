{% if article is defined %}
<meta property="og:type" content="article">
<meta property="og:title" content="{{ article.title|striptags }} | {{ SITENAME }}">
<meta property="og:description" content="{{ article.summary|striptags|truncate(200) }}">
<meta property="og:url" content="{{ SITEURL }}/{{ article.url }}">
{% if article.image %}<meta property="og:image" content="{{ article.image }}">{% endif %}
<meta property="article:published_time" content="{{ article.date.isoformat() }}">
<meta property="article:author" content="{{ article.author.name if article.author else AUTHOR }}">
{% elif page is defined %}
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.title }} | {{ SITENAME }}">
<meta property="og:description" content="{{ page.content|striptags|truncate(200) }}">
<meta property="og:url" content="{{ SITEURL }}/{{ page.url }}">
{% else %}
<meta property="og:type" content="website">
<meta property="og:title" content="{{ SITENAME }}">
<meta property="og:description" content="{{ SITEDESCRIPTION }}">
<meta property="og:url" content="{{ SITEURL }}/">
{% endif %}
<meta property="og:site_name" content="{{ SITENAME }}">
<meta property="og:locale" content="{{ DEFAULT_LOCALE | default('en_US') }}">
